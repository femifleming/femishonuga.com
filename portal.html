<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>webring portal</title>
<link rel="icon" type="image/x-icon" href="favicon.webp">
<!--
  HOW THIS PAGE WORKS
  The list of sites is read from webring.html every time the portal opens,
  so to add or remove a site you only edit webring.html.
  To add a personal note about a site, add it to NOTES below.

  Keys:  ← / →  back / forward    r  random    v  visit (new tab)    p  portal
  Links: portal.html#redeel.org opens the portal on that site.
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff;
    font-family: 'Times New Roman', Times, serif; font-size: 16px; }
  body { display: flex; flex-direction: column; }
  #bar { display: flex; gap: 10px; padding: 10px; }
  #bar button, #bar select { flex: 1 1 0; min-width: 0; font: inherit; color: #fff;
    background: #000; border: none; cursor: pointer; transition: background-color .3s; }
  #bar button:hover, #bar button:focus-visible, #bar select:hover { background: #fff; color: #000; }
  #bar select { text-align: center; text-overflow: ellipsis; }
  #bar select option { background: #000; color: #fff; }
  #back, #forward { transition: text-align 1s ease, background-color .3s; }
  #back:hover { text-align: left; }
  #forward:hover { text-align: right; }
  marquee { background: #1c1c1c; padding: 2px 0; }
  iframe { flex: 1; width: 100%; border: none; background: #fff; }
  @media (max-width: 600px) {
    #bar { flex-wrap: wrap; }
    #bar select { flex-basis: 100%; order: 9; }
  }
</style>
</head>
<body>

<div id="bar">
  <button id="back" title="previous site (←)">&lt;-- back</button>
  <button onclick="location.href='webring.html'" title="back to the webring page (p)">portal</button>
  <select id="pick" title="jump to a site"></select>
  <button id="random" title="random site (r)">random</button>
  <button id="visit" title="open this site in a new tab (v)">visit</button>
  <button id="forward" title="next site (→)">forward --&gt;</button>
</div>

<marquee id="info">loading the webring...</marquee>

<iframe id="frame" title="webring site"></iframe>

<script>
// Personal notes shown in the marquee. Key = the site's address without
// https:// or www. (and without a trailing slash).
const NOTES = {
  "funbox.sh/~cenzo": "Enzo is my good friend in providence who does live visuals with his analog video synthesis mixer and 16mm film. He helped me build my site, set up my email and learn html and bash! He is my favorite providence wizard.",
  "cryptwarbler.net": "Cryptwarbler is my good friend robin who is a circuit bending genius!",
  "williamhazard.co": "William helped me build my first html site and makes awesome music with modular synths.",
  "sacred-web.vercel.app": "Sacred Web was built by my good friend π.",
  "eachspringnewbeginning.com": "Maddie helped me build the box for my Rolz5.",
  "mark.cetilia.org": "Mark was my professor at RISD for Sound Synthesis and Of Sound and Vision. He taught me max, supercollider and the serge modular synth. We have a duo project titled Triplets.",
  "sacred-web.vercel.app/dots.html": "Dots was created as live visuals for sadnoise sets by π.",
  "cancelled.work": "cancelled.work is a community of people in the local providence, RI and boston, MA area. It started based on the idea me and Grief had for a server co-op where local artists can host their site or have pages on a local web board. It's an homage to early internet, webrings, neocities etc. with a focus on being a wiki, archive, comment board and media hosting platform for local artists. The server lives at grove st in providence, RI.",
  "dfiction.com": "Daniel is my good friend! We work together to build Daxophones, Solar Sounders and Arbrassons. He is a good friend of Peter Blasser as well.",
  "hankhurst.com": "Hank is my good friend from RISD, we DJ house and techno together as Select All Vertical Rivers.",
};

const $ = id => document.getElementById(id);
const key = url => url.replace(/^https?:\/\/(www\.)?/i, "").replace(/\/+$/, "").toLowerCase();
let sites = [], i = 0;

function show(n) {
  i = (n + sites.length) % sites.length;
  const s = sites[i];
  $("frame").src = s.url;
  $("pick").value = i;
  const note = NOTES[key(s.url)];
  $("info").textContent = `${i + 1} / ${sites.length} · ${s.section} · You are currently viewing the site of ${s.name}`
    + (s.tag ? ` (${s.tag})` : "") + (note ? `. ${note}` : "");
  history.replaceState(null, "", "#" + key(s.url));
}

// Read every list on webring.html: each <ol> is a section, named by the <p> before it.
async function load() {
  const html = await (await fetch("webring.html", { cache: "no-cache" })).text();
  const doc = new DOMParser().parseFromString(html, "text/html");
  const seen = new Set();
  for (const ol of doc.querySelectorAll("ol")) {
    const label = ol.previousElementSibling;
    const section = (label ? label.textContent : "").replace(/:\s*$/, "").trim().toLowerCase();
    for (const li of ol.querySelectorAll(":scope > li")) {
      const a = li.querySelector("a[href]");
      if (!a || seen.has(key(a.href))) continue;
      seen.add(key(a.href));
      const tag = li.querySelector(".append");
      sites.push({ url: a.href, name: a.textContent.trim(), section,
                   tag: tag ? tag.textContent.trim() : "" });
    }
  }
  $("pick").innerHTML = sites.map((s, n) => `<option value="${n}">${s.name}</option>`).join("");
  const start = sites.findIndex(s => key(s.url) === decodeURIComponent(location.hash.slice(1)));
  show(start >= 0 ? start : 0);
}

const random = () => sites.length > 1 && show((i + 1 + Math.floor(Math.random() * (sites.length - 1))) % sites.length);
const visit = () => window.open(sites[i].url, "_blank", "noopener");

$("back").onclick = () => show(i - 1);
$("forward").onclick = () => show(i + 1);
$("random").onclick = random;
$("visit").onclick = visit;
$("pick").onchange = e => show(+e.target.value);

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.tagName === "SELECT") return;
  const k = e.key.toLowerCase();
  if (k === "arrowleft") show(i - 1);
  else if (k === "arrowright") show(i + 1);
  else if (k === "r") random();
  else if (k === "v") visit();
  else if (k === "p") location.href = "webring.html";
});

load().catch(() => {
  $("info").textContent = "couldn't read webring.html. If you opened this file straight from your computer, run `python3 -m http.server` in the site folder and go to localhost:8000/portal.html";
});
</script>
</body>
</html>
